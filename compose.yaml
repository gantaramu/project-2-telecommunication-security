
services:
  django:
    build:
      context: ./app
    container_name: project2-django
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "replace-this-with-a-random-secret-before-deployment"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,nginx"
    expose:
      - "8000"
    volumes:
      - django-data:/app/data

  nginx:
    image: nginx:latest
    container_name: project2-nginx
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/localhost.crt:/etc/nginx/certs/localhost.crt:ro
      - ./certs/localhost.key:/etc/nginx/certs/localhost.key:ro

volumes:
  django-data:


